# GitHub Pages 자동 배포 워크플로우
# main 브랜치에 파일을 올릴 때마다 자동으로 GitHub Pages를 갱신합니다.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # main 브랜치에 push 할 때마다 실행

  workflow_dispatch:  # GitHub 웹에서 수동으로 배포 버튼을 누를 수 있게 허용

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      # ui/src/ 폴더만 게임 파일로 배포합니다.
      # docs/, data/ 등 기획 문서는 배포에서 제외됩니다.
      - name: 게임 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/src

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
