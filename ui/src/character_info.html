<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 능력치 — Project 베르시온</title>
<style>
/* ═══════════════════════════════════════════════
   전역 변수 / 리셋
═══════════════════════════════════════════════ */
*  { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-deep:   #0d1117;
    --bg-panel:  #161b22;
    --bg-card:   #21262d;
    --bg-hover:  #2d333b;
    --border:    #30363d;
    --text:      #c9d1d9;
    --sub:       #8b949e;
    --dim:       #484f58;
    --blue:      #58a6ff;
    --green:     #3fb950;
    --yellow:    #d29922;
    --red:       #f85149;
    --purple:    #c084fc;
    --gold:      #ffd700;
}

body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
    font-size: 15px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ═══════════════════════════════════════════════
   상단 헤더
═══════════════════════════════════════════════ */
#header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.hdr-title {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--gold), #ff9500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
}

.hdr-level {
    background: linear-gradient(135deg, #1f6feb, #58a6ff);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
}

.hdr-sync {
    font-size: 15px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 5px;
}

.sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
}

.hdr-spacer { flex: 1; }

.hdr-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--sub);
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
}
.hdr-btn:hover { background: var(--bg-hover); color: var(--text); }
.hdr-btn.primary { border-color: #1f6feb; color: var(--blue); }
.hdr-btn.primary:hover { background: #1f6feb; color: #fff; }

/* ═══════════════════════════════════════════════
   HP / MP 섹션
═══════════════════════════════════════════════ */
#vital-section {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex;
    gap: 20px;
    flex-shrink: 0;
}

.vital-block { flex: 1; max-width: 420px; }

.vital-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 5px;
}

.vital-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
}
.vital-name.hp { color: #ff7b72; }
.vital-name.mp { color: var(--blue); }

.vital-nums { font-size: 15px; color: var(--sub); }
.vital-nums .cur { font-size: 16px; font-weight: 700; }
.vital-nums.hp .cur { color: #ff7b72; }
.vital-nums.mp .cur { color: var(--blue); }
.vital-nums .sep { color: var(--dim); margin: 0 3px; }
.vital-nums .max { color: var(--text); font-weight: 600; }

.vital-bar-wrap {
    height: 16px;
    background: var(--bg-card);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
}

.vital-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.6s ease;
    position: relative;
}
.vital-fill.hp {
    background: linear-gradient(90deg, #7f1d1d, #dc2626, #ef4444);
    box-shadow: 0 0 10px rgba(239,68,68,0.35);
}
.vital-fill.mp {
    background: linear-gradient(90deg, #1e3a8a, #2563eb, #60a5fa);
    box-shadow: 0 0 10px rgba(96,165,250,0.35);
}

.vital-bar-label {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    pointer-events: none;
    white-space: nowrap;
}

.vital-note {
    font-size: 15px;
    color: var(--dim);
    margin-top: 4px;
    font-style: italic;
}

/* ═══════════════════════════════════════════════
   게임 스타일 스크롤바 (전역 적용)
═══════════════════════════════════════════════ */
* {
    scrollbar-width: thin;
    scrollbar-color: #30363d transparent;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 2px;
}
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* ═══════════════════════════════════════════════
   기본 스탯 섹션
═══════════════════════════════════════════════ */
#base-stat-section {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px 12px;
    flex-shrink: 0;
}

#base-stat-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.bs-card {
    background: var(--bg-card);
    border: 1px solid #238636;
    border-radius: 7px;
    padding: 8px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.bs-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    border-radius: 7px 0 0 7px;
}
.bs-card-name { font-size: 15px; color: var(--sub); margin-bottom: 2px; }
.bs-card-val  { font-size: 20px; font-weight: 700; color: var(--green); line-height: 1.1; }
.bs-card-sub  { font-size: 15px; color: var(--dim); margin-top: 2px; }

/* ═══════════════════════════════════════════════
   메인 패널 — 치환 능력치 / 전체 능력치 탭
═══════════════════════════════════════════════ */
#main-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
}

/* 메인 탭 바 */
.main-tab-bar {
    display: flex;
    background: var(--bg-panel);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
    padding: 0 12px;
    gap: 0;
    overflow-x: auto; /* 탭이 많아 좁은 폭에서 잘리지 않도록 수평 스크롤 허용 */
}

.main-tab-btn {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--sub);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -2px;
}
.main-tab-btn:hover { color: var(--text); }
.main-tab-btn.on { color: var(--gold); border-bottom-color: var(--gold); }

/* 🎁 보너스 출처별 능력치 탭 */
#source-list { padding: 12px 14px 24px; overflow-y: auto; }
.src-intro {
    background: rgba(79,195,247,0.06);
    border: 1px solid rgba(79,195,247,0.25);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--sub);
    line-height: 1.55;
}
.src-empty {
    text-align: center;
    color: var(--dim);
    font-size: 14px;
    padding: 36px 12px;
}
.src-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 6px;
    margin-bottom: 12px;
    overflow: hidden;
}
.src-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
}
.src-section-name {
    font-size: 15px;
    font-weight: 700;
}
.src-section-cnt {
    background: var(--bg-panel);
    color: var(--sub);
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
}
.src-stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 12px;
    padding: 8px 12px 10px;
}
.src-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    background: var(--bg-panel);
    border-radius: 4px;
    font-size: 13px;
    min-height: 22px;
}
.src-stat-name { color: var(--text); }
.src-stat-val { font-weight: 700; font-family: tabular-nums; }

/* 🧮 능력치 적용 공식 탭 */
#formula-list { padding: 12px 14px 24px; overflow-y: auto; }
.formula-intro {
    background: rgba(79,195,247,0.06);
    border: 1px solid rgba(79,195,247,0.25);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--sub);
    line-height: 1.55;
}
.formula-intro code {
    background: rgba(167,139,250,0.12);
    padding: 1px 5px;
    border-radius: 3px;
    color: #a78bfa;
    font-family: 'Consolas','D2Coding',monospace;
    font-size: 13px;
}
.formula-cat-section { margin-bottom: 18px; }
.formula-cat-header {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    padding: 6px 10px;
    border-left: 4px solid var(--gold);
    background: rgba(245,208,98,0.08);
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.formula-cat-count {
    font-size: 13px;
    color: var(--sub);
    background: rgba(255,255,255,0.06);
    padding: 1px 8px;
    border-radius: 10px;
}
.formula-row {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 12px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.025);
    border: 1px solid #21262d;
    border-radius: 6px;
}
.formula-name { font-size: 15px; font-weight: 700; color: var(--text); }
.formula-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.formula-eq code {
    display: block;
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'Consolas','D2Coding',monospace;
    font-size: 13px;
    color: #b3e0ff;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
}
.formula-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    flex-wrap: wrap;
}
.formula-meta-lbl { color: var(--sub); flex-shrink: 0; }
.formula-output {
    color: #58d364;
    font-weight: 600;
    font-family: 'Consolas','D2Coding',monospace;
    font-size: 13px;
}
.formula-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.formula-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: rgba(79,195,247,0.10);
    border: 1px solid rgba(79,195,247,0.35);
    border-radius: 10px;
    font-size: 13px;
    color: #4fc3f7;
    cursor: help;
}
.formula-chip small {
    color: var(--dim);
    font-size: 11px;
    font-family: 'Consolas','D2Coding',monospace;
    font-weight: 400;
}
/* 1차 능력치의 인게임 획득 경로 라벨 — chip 내부 우측에 작게 표시 */
.formula-route {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    margin-left: 4px;
    padding: 0 4px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid currentColor;
    line-height: 1.3;
}
.formula-empty { color: var(--dim); font-style: italic; font-size: 13px; }
.formula-chip.meta {
    background: rgba(167,139,250,0.10);
    border-color: rgba(167,139,250,0.35);
    color: #a78bfa;
}
.formula-note {
    font-size: 13px;
    color: var(--sub);
    line-height: 1.5;
    margin-top: 2px;
    padding-left: 6px;
    border-left: 2px solid #30363d;
}
@media (max-width: 720px) {
    .formula-row { grid-template-columns: 1fr; }
}

/* 🎯 스탯 분배 패널 */
#mtab-distrib {
    overflow-y: auto;
    padding: 14px 18px 18px;
}
.dst-header-card {
    background: linear-gradient(135deg, rgba(102,187,106,0.10), rgba(79,195,247,0.06));
    border: 1px solid rgba(102,187,106,0.45);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 14px;
}
.dst-header-title {
    font-size: 16px;
    font-weight: 700;
    color: #66bb6a;
    margin-bottom: 6px;
}
.dst-header-desc {
    font-size: 15px;
    color: var(--sub);
    line-height: 1.55;
}
.dst-header-desc code {
    background: rgba(0,0,0,0.4);
    padding: 1px 7px;
    border-radius: 4px;
    color: #ffd86b;
}
.dst-summary-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed rgba(102,187,106,0.35);
    font-size: 15px;
}
.dst-summary-row .lbl { color: var(--sub); margin-right: 4px; }
.dst-summary-row .val { color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }
.dst-summary-row .val.warn { color: #ff7b72; }
.dst-summary-row .val.dim { color: var(--sub); font-weight: 600; }

.dst-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 15px;
}
.dst-table th, .dst-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #21262d;
    text-align: center;
}
.dst-table th {
    background: rgba(255,255,255,0.04);
    color: var(--sub);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.3px;
}
.dst-table td.dst-stat-name {
    text-align: left;
    color: var(--text);
    font-weight: 600;
    min-width: 110px;
}
.dst-stat-abbr { color: var(--sub); font-weight: 500; margin-left: 2px; }
.dst-table td.dst-base { color: var(--sub); }
.dst-table td.dst-eff { color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }
.dst-table td.dst-delta { color: #79c0ff; font-weight: 600; font-variant-numeric: tabular-nums; }
.dst-table td.dst-delta.zero { color: var(--dim); font-weight: 500; }

.dst-ctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.dst-btn {
    width: 26px; height: 26px;
    border-radius: 5px;
    border: 1px solid #30363d;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.dst-btn:hover:not(:disabled) {
    background: rgba(102,187,106,0.22);
    border-color: var(--green);
    color: var(--green);
}
.dst-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.dst-input {
    width: 64px;
    padding: 3px 6px;
    text-align: center;
    background: var(--bg-panel);
    color: var(--text);
    border: 1px solid #30363d;
    border-radius: 4px;
    font-size: 15px;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
}
.dst-input:focus { outline: none; border-color: var(--green); }

.dst-buttons-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 14px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
}
.dst-action-btn {
    padding: 7px 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 5px;
    border: 1px solid #30363d;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.dst-action-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.dst-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.dst-action-btn.apply { border-color: var(--green); color: var(--green); }
.dst-action-btn.apply:hover:not(:disabled) { background: rgba(102,187,106,0.18); }
.dst-action-btn.reset { border-color: #e3b341; color: #e3b341; }
.dst-action-btn.reset:hover:not(:disabled) { background: rgba(227,179,65,0.15); }
.dst-action-btn.revert { border-color: #8b949e; color: var(--sub); }

.dst-msg {
    font-size: 15px;
    color: var(--sub);
    margin-right: auto;
    align-self: center;
}
.dst-msg.ok { color: #58a6ff; }
.dst-msg.warn { color: #ff7b72; }

.dst-section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
    margin-bottom: 10px;
    margin-top: 4px;
}

/* 치환 결과 미리보기 — 치환 능력치 탭과 동일한 2컬럼 그룹 레이아웃
   (.key-group-header / .key-item / .key-item-name / .key-item-val 재활용 + dst-* 보강) */
.dst-subst-key-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 12px;
}
.dst-key-group-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
}
.dst-key-grp-dist {
    font-size: 15px;
    font-weight: 700;
    color: #58d364;
    background: rgba(88, 211, 100, 0.12);
    border: 1px solid rgba(88, 211, 100, 0.35);
    border-radius: 10px;
    padding: 1px 8px;
}
.dst-key-item .key-item-val {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
}
.dst-key-item-delta {
    font-size: 15px;
    font-weight: 700;
    padding: 0 6px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
}
.dst-key-item-delta.pos {
    color: #58d364;
    background: rgba(88, 211, 100, 0.12);
}
.dst-key-item-delta.neg {
    color: #ff7b72;
    background: rgba(255, 123, 114, 0.12);
}
.dst-subst-empty {
    font-size: 15px;
    color: var(--dim);
    font-style: italic;
    padding: 8px 4px;
}
.dst-subst-note {
    font-size: 15px;
    color: var(--sub);
    margin: -4px 0 8px;
    padding: 0 2px;
}

.dst-not-available {
    background: rgba(255,123,114,0.05);
    border: 1px solid rgba(255,123,114,0.30);
    border-radius: 8px;
    padding: 14px 18px;
    color: var(--sub);
    font-size: 15px;
    line-height: 1.6;
    margin-top: 6px;
}
.dst-not-available code {
    background: rgba(0,0,0,0.4);
    padding: 1px 7px;
    border-radius: 4px;
    color: #ffd86b;
}

/* 패널 공통 */
.main-panel-page {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
}
.main-panel-page.on { display: flex; }

/* ── 치환 능력치 패널 ── */
#mtab-subst {
    overflow-y: auto;
    padding: 8px 18px 12px;
}

/* 치환 능력치 — 2열 그리드 래퍼 */
#key-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 12px;
}

/* 기본 스탯 그룹 헤더 — 2열 전체 차지 */
.key-group-header {
    grid-column: 1 / -1;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    padding: 8px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-top: 8px;
    position: sticky;
    top: 0;
    background: var(--bg-deep);
    z-index: 1;
}
.key-group-header:first-child { margin-top: 0; }

/* 치환 능력치 한 줄 아이템 */
.key-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;

                   oninput="renderList()">

<!-- 하단 보너스 바 -->
<div id="bonus-bar">
    <span>적용된 보너스 출처:</span>
    <div id="bonus-srcs" style="display:flex;gap:5px;flex-wrap:wrap;">
        <span style="color:var(--dim);">없음 — 장착 아이템 / 버프 / 스킬이 추가되면 여기에 표시됩니다.</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════
     stats_calc.js 로드 (STAT_LIST + computeStats 함수 포함)
═══════════════════════════════════════════════ -->
<script src="stats_calc.js"></script>

<script>
// ════════════════════════════════════════════════════════════
//  상태 변수
// ════════════════════════════════════════════════════════════
let currentLevel  = 1;
let currentTab    = '전체';
let currentStats  = {};     // computeStats 결과 캐시

// 현재 HP/MP (field_battle.html에서 localStorage로 전달받음)
let currentHP = null;
let currentMP = null;

// 기본 스탯 (field_battle.html에서 versione_base_stats로 전달받음)
let currentBaseStats = { STR:10, DEX:10, INT:10, AGI:10, CON:10, WIS:10, LUK:10 };

// 보너스 레지스트리 { sourceId: { en키: 값 } }
const bonusReg = {};

// ════════════════════════════════════════════════════════════
//  보너스 API — 이후 아이템/스킬/버프 시스템에서 호출
//  예: addBonus('무기_강검', { MeleeMinAttack: 100, STR: 5 })
// ════════════════════════════════════════════════════════════
function addBonus(sourceId, stats) {
    bonusReg[sourceId] = stats;
    renderAll();
    toast(`보너스 적용: [${sourceId}]`);
}

function removeBonus(sourceId) {
    delete bonusReg[sourceId];
    renderAll();
}

// 모든 보너스 합산 (computeStats 계산용 — 기본값 포함)
function mergedBonuses() {
    const out = {};
    for (const src of Object.values(bonusReg)) {
        for (const [k, v] of Object.entries(src)) {
            out[k] = (out[k] || 0) + v;
        }
    }
    return out;
}

// ── 게임 기본값 출처 판별 ──────────────────────────────────────────
// bonusReg 키가 '__'로 시작하면 "게임 기본값"으로 분류한다.
// 현재: __lv_stat_config__  (기본 스탯 치환은 computeStats 내부에서 처리)
// 앞으로 능력치 설정에 새 항목이 추가될 때도 키를 '__...__' 형식으로 만들면
// 자동으로 기본값으로 처리된다.
function isGameDefault(sourceId) {
    return sourceId.startsWith('__');
}

// 외부 보너스만 반환 (장비·버프 등 — 게임 기본값 출처 제외)
// 전체 능력치 UI에서 "추가 수치(초록)"와 "최종값(노란)" 표시에 사용
function externalBonuses() {
    const out = {};
    for (const [src, stats] of Object.entries(bonusReg)) {
        if (isGameDefault(src)) continue;
        for (const [k, v] of Object.entries(stats)) {
            out[k] = (out[k] || 0) + v;
        }
    }
    return out;
}

// ════════════════════════════════════════════════════════════
//  localStorage 동기화
//  field_battle.html이 저장하는 키: 'versione_char'
//  {level, currentHP, maxHP, currentMP, maxMP, savedAt, ...}
// ════════════════════════════════════════════════════════════
function syncNow() {
    try {
        const raw = localStorage.getItem('versione_char');
        if (!raw) {
            toast('게임 데이터 없음 — field_battle.html을 먼저 실행하세요.');
            updateSyncStatus(false);
            return;
        }
        const d = JSON.parse(raw);
        const prev = currentLevel;
        currentLevel = d.level || 1;

        // 게임에서 전달한 currentHP/MP가 있으면 사용, 없으면 최대값(풀 회복)
        currentHP = (d.currentHP != null) ? d.currentHP : null;
        currentMP = (d.currentMP != null) ? d.currentMP : null;

        // ── 레벨 능력치 설정(LV_STAT_CONFIG) 반영
        try {
            const lvRaw = localStorage.getItem('versione_lv_stat_config');
            if (lvRaw) {
                const lvCfg = JSON.parse(lvRaw);
                const lvBon = {};
                for (const row of lvCfg) {
                    lvBon[row.en] = (lvBon[row.en] || 0)
                        + row.base + (currentLevel - 1) * row.perLv;
                }
                bonusReg['__lv_stat_config__'] = lvBon;
            } else {
                delete bonusReg['__lv_stat_config__'];
            }
        } catch (_) { delete bonusReg['__lv_stat_config__']; }

        // ── 능력치 보너스 통합 수신 — field_battle.html이 publish하는 모든 소스 ──
        // 키: versione_char_bonuses, 구조: { equipment: {...}, refine: {...}, classSpeed: {...}, _meta: {...}, ... }
        // 각 카테고리는 stats_calc.js STAT_LIST의 en 키 → 수치(raw) 객체
        // 신규 카테고리(세트 보너스·타이틀·버프 등)도 field_battle 측 _BONUS_SOURCES에 추가되면 여기로 자동 흘러옴
        // → 신규 컨텐츠가 능력치 상세 보기에 자동 반영되는 확장 가능 구조
        try {
            const cbRaw = localStorage.getItem('versione_char_bonuses');
            // 기존 외부 보너스(이전 sourceId 들) 일괄 제거 — 게임 기본값(__...__)은 보존
            for (const k of Object.keys(bonusReg)) {
                if (!k.startsWith('__') && k.startsWith('field:')) delete bonusReg[k];
            }
            if (cbRaw) {
                const payload = JSON.parse(cbRaw) || {};
                for (const [cat, stats] of Object.entries(payload)) {
                    if (cat === '_meta' || !stats || typeof stats !== 'object') continue;
                    // 비-0 항목만 추출
                    const filtered = {};
                    let hasAny = false;
                    for (const [k, v] of Object.entries(stats)) {
                        if (v !== 0 && v != null) { filtered[k] = v; hasAny = true; }
                    }
                    if (hasAny) bonusReg['field:' + cat] = filtered;
                }
            }
        } catch (_) { /* publish 데이터 손상 시 무시 — 기본값만으로 표시 */ }

        // ── 현재 클래스 및 기본 스탯 로드 (클래스별 독립 저장)
        try {
            const classId = d.classId || localStorage.getItem('versione_current_class') || 'knight';
            const classKey = 'versione_class_stats_' + classId;
            const bsRaw = localStorage.getItem(classKey)
                       || localStorage.getItem('versione_base_stats');
            currentBaseStats = bsRaw
                ? JSON.parse(bsRaw)
                : { STR:10, DEX:10, INT:10, AGI:10, CON:10, WIS:10, LUK:10 };
            // 헤더에 클래스 뱃지 표시
            const CLASS_LABELS = {
                knight:'나이트', warrior:'워리어', assassin:'어쌔신',
                archer:'아처',   cleric:'클레릭',  sorcerer:'소서러'
            };
            const CLASS_COLORS = {
                knight:'#c8e0f8', warrior:'#e84040', assassin:'#b060ee',
                archer:'#56c774', cleric:'#f5d062',  sorcerer:'#7090e8'
            };
            let classBadge = document.getElementById('hdr-class-badge');
            if (!classBadge) {
                classBadge = document.createElement('div');
                classBadge.id = 'hdr-class-badge';
                classBadge.style.cssText = 'font-size:15px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid currentColor;margin-left:2px;';
                const hdr = document.getElementById('header');
                const lvBadge = document.getElementById('hdr-lv');
                hdr.insertBefore(classBadge, lvBadge.nextSibling);
            }
            const clr = CLASS_COLORS[classId] || '#c8e0f8';
            classBadge.textContent = CLASS_LABELS[classId] || classId;
            classBadge.style.color = clr;
            classBadge.style.borderColor = clr + '80';
            classBadge.style.background = clr + '18';
        } catch (_) {
            currentBaseStats = { STR:10, DEX:10, INT:10, AGI:10, CON:10, WIS:10, LUK:10 };
        }

        const age = Math.round((Date.now() - (d.savedAt || Date.now())) / 1000);
        document.getElementById('sync-txt').textContent =
            `${age}초 전 동기화 · Lv.${currentLevel}`;
        updateSyncStatus(true);

        renderAll();
        if (prev !== currentLevel) toast(`Lv.${currentLevel} 데이터 동기화 완료`);
    } catch (e) {
        updateSyncStatus(false);
    }
}

function updateSyncStatus(ok) {
    const dot = document.getElementById('sync-dot');
    dot.style.background = ok ? 'var(--green)' : 'var(--red)';
}

// ════════════════════════════════════════════════════════════
//  전체 렌더링
// ════════════════════════════════════════════════════════════
function renderAll() {
    const lv  = currentLevel;
    const bon = mergedBonuses();
    // bonuses = 레벨 능력치(__lv_stat_config__) + 외부 보너스
    // 치환 보너스(baseStats → 2차 스탯)는 computeStats 내부에서 자동 합산
    currentStats = computeStats(bon, currentBaseStats);

    // 헤더 레벨 뱃지
    document.getElementById('hdr-lv').textContent = `Lv. ${lv}`;

    // HP/MP — field_battle에서 전달받은 값 우선, 없으면 최대값
    const maxHp = currentStats.MaxHP;
    const maxMp = currentStats.MaxMP;
    const curHp = (currentHP != null) ? Math.min(currentHP, maxHp) : maxHp;
    const curMp = (currentMP != null) ? Math.min(currentMP, maxMp) : maxMp;
    const hpPct = maxHp > 0 ? Math.round(curHp / maxHp * 100) : 100;
    const mpPct = maxMp > 0 ? Math.round(curMp / maxMp * 100) : 100;

    document.getElementById('hp-cur').textContent  = curHp.toLocaleString();
    document.getElementById('hp-max').textContent  = maxHp.toLocaleString();
    document.getElementById('mp-cur').textContent  = curMp.toLocaleString();
    document.getElementById('mp-max').textContent  = maxMp.toLocaleString();
    document.getElementById('hp-fill').style.width = hpPct + '%';
    document.getElementById('mp-fill').style.width = mpPct + '%';
    document.getElementById('hp-pct').textContent  = hpPct + '%';
    document.getElementById('mp-pct').textContent  = mpPct + '%';

    // 탭 카운트 (재분류 후 실제 kind 기준)
    const kinds = ['기타','공격','방어','특수'];
    const total = STAT_LIST.filter(s => kinds.includes(s.kind)).length;
    document.getElementById('cnt-전체').textContent = total;
    kinds.forEach(k => {
        const el = document.getElementById('cnt-' + k);
        if (el) el.textContent = STAT_LIST.filter(s => s.kind === k).length;
    });
    // 활성 탭: 현재 수치가 0 초과인 능력치 수
    const extBon = externalBonuses();
    const activeCnt = STAT_LIST.filter(s => {
        if (!kinds.includes(s.kind)) return false;
        const computedVal = currentStats[s.en];
        const val = (computedVal !== undefined) ? computedVal : (extBon[s.en] || 0);
        return val > 0;
    }).length;
    const elActive = document.getElementById('cnt-활성');
    if (elActive) elActive.textContent = activeCnt;

    // 기본 스탯 카드 (최우선)
    renderBaseStatCards();

    // 주요 능력치 카드
    renderKeyCards(lv, bon);

    // 보너스 출처 표시
    renderBonusSrcs();

    // 보너스 출처별 능력치 (탭이 활성화되어 있지 않아도 백그라운드 갱신)
    if (typeof renderSourceBreakdown === 'function') renderSourceBreakdown();

    // 스탯 목록
    renderList();

}

//  기본 스탯 카드 렌더링
// ════════════════════════════════════════════════════════════
const BASE_STAT_CARD_DEFS = [
    { key:'STR', label:'힘',   abbr:'STR', desc:'근거리 계열' },
    { key:'DEX', label:'민첩', abbr:'DEX', desc:'원거리 계열' },
    { key:'INT', label:'지능', abbr:'INT', desc:'마법 계열'   },
    { key:'AGI', label:'순발', abbr:'AGI', desc:'속도/회피'   },
    { key:'CON', label:'건강', abbr:'CON', desc:'HP/방어'     },
    { key:'WIS', label:'지혜', abbr:'WIS', desc:'MP/마법방어' },
    { key:'LUK', label:'행운', abbr:'LUK', desc:'치명타/저항' },
];

function renderBaseStatCards() {
    const grid = document.getElementById('base-stat-grid');
    if (!grid) return;
    grid.innerHTML = BASE_STAT_CARD_DEFS.map(d => {
        // 실효값: computeStats 결과(설정 + 레벨 보너스 + AllStat 증폭 반영)
        const effective = (currentStats[d.key] !== undefined)
            ? currentStats[d.key]
            : (currentBaseStats[d.key] || 10);
        const setting = currentBaseStats[d.key] || 10;
        // 레벨 보너스 등으로 실효값이 설정값과 다르면 설정값을 부가 표시
        const subText = (effective !== setting)
            ? `${d.desc} · 설정 ${setting}`
            : d.desc;
        return `<div class="bs-card">
            <div class="bs-card-name">${d.label} (${d.abbr})</div>
            <div class="bs-card-val">${effective.toLocaleString()}</div>
            <div class="bs-card-sub">${subText}</div>
        </div>`;
    }).join('');
}

//  주요 능력치 카드 — 010_스탯_치환값 기준 7개 기본 스탯 그룹
// ════════════════════════════════════════════════════════════
const KEY_GROUP_META = [
    { stat:'STR', label:'💪 힘(STR)',   cls:'atk' },
    { stat:'DEX', label:'🏹 민첩(DEX)', cls:'atk' },
    { stat:'INT', label:'🔮 지능(INT)', cls:'atk' },
    { stat:'AGI', label:'⚡ 순발(AGI)', cls:'def' },
    { stat:'CON', label:'🛡 건강(CON)', cls:'def' },
    { stat:'WIS', label:'💡 지혜(WIS)', cls:'def' },
    { stat:'LUK', label:'🍀 행운(LUK)', cls:'util' },
];

function renderKeyCards(lv, bon) {
    if (typeof BASE_STAT_SUBSTITUTION === 'undefined') return;
    const grid   = document.getElementById('key-grid');
    const pctSet = (typeof SUBST_PCT_STATS !== 'undefined') ? SUBST_PCT_STATS : new Set();

    let html = '';
    for (const grp of KEY_GROUP_META) {
        const entries = BASE_STAT_SUBSTITUTION[grp.stat] || [];
        if (!entries.length) continue;
        html += `<div class="key-group-header">${grp.label}</div>`;
        for (const e of entries) {
            // computeStats 반환값 우선, 없으면 bon(치환 보너스 포함)에서 읽음
            const raw     = currentStats[e.key] != null ? currentStats[e.key] : (bon[e.key] ?? 0);
            const isPct   = pctSet.has(e.key);
            const dispVal = isPct
                ? (raw / 100).toFixed(2) + '%'
                : Math.round(raw).toLocaleString();
            // 형식: 한글명(영문명)  수치
            html += `<div class="key-item ${grp.cls}">
                <span class="key-item-name">${e.label}(${e.key})</span>
                <span class="key-item-val">${dispVal}</span>
            </div>`;
        }
    }
    grid.innerHTML = html;
}

function setMainTab(tab) {
    ['subst', 'stat', 'source', 'formula'].forEach(t => {
        const btn  = document.getElementById('mtab-btn-' + t);
        const page = document.getElementById('mtab-' + t);
        if (btn)  btn.classList.toggle('on', t === tab);
        if (page) page.classList.toggle('on', t === tab);
    });
    // 공식 탭으로 전환 시 즉시 렌더 (최신 currentStats 반영)
    if (tab === 'formula' && typeof renderFormulas === 'function') renderFormulas();
    // 보너스 출처 탭으로 전환 시 즉시 렌더 (최신 bonusReg 반영)
    if (tab === 'source' && typeof renderSourceBreakdown === 'function') renderSourceBreakdown();

// 한글 라벨 조회 — STAT_LIST에서 en → kr
function _statLabelOf(en) {
    if (typeof STAT_LIST === 'undefined') return en;
    const row = STAT_LIST.find(s => s.en === en);
    return row ? row.kr : en;
}

// Total* 출력 키에서 카테고리 자동 추정 (TOTAL_STAT_FORMULAS에 c가 없는 경우 fallback)
function _inferCategory(o) {
    if (!o) return '99_미분류';
    if (/^Total(STR|DEX|INT|AGI|CON|WIS|LUK|AllStat)(?:AmplifyRate|WeakenRate)?$/.test(o)) return '01_기본 스탯';
    if (/MaxHealthPoint|MaxManaPoint|HealthRegen|ManaRegen/.test(o)) return '02_HP / MP';
    if (/PotionRecovery/.test(o))                                    return '03_물약 회복';
    if (/Critical(?:Resist|DamageReduction)/.test(o))                return '07_치명타 저항/감소';
    if (/ExtraCriticalResist/.test(o))                               return '07_치명타 저항/감소';
    if (/(?:^Total|Pve|Pvp|Normal|Skill)?(?:Melee|Ranged|Magic)?(?:Min|Max)?Attack(?:AmplifyRate|WeakenRate)?$/.test(o)) return '04_공격력';
    if (/AtCritical.*Attack/.test(o))                                return '04_공격력';
    if (/(?:^Total)?(?:Melee|Ranged|Magic|All|Physical)?Defense(?:AmplifyRate|WeakenRate)?$/.test(o)) return '05_방어력';
    if (/Critical(?:AmplifyRate|WeakenRate)?$/.test(o) || /ExtraCritical(?:AmplifyRate|WeakenRate)?$/.test(o)) return '06_치명타';
    if (/Evasion/.test(o))                                           return '08_회피';
    if (/Accuracy/.test(o))                                          return '09_명중';
    if (/Hit(?:AmplifyRate|WeakenRate)?$/.test(o))                   return '10_상태이상 적중';
    if (/Resist(?:AmplifyRate|WeakenRate)?$/.test(o))                return '11_상태이상 저항';
    if (/DamageReduction|DamageReductionRate|DamageReductionIgnore/.test(o)) return '12_피해 감소';
    if (/Target.*Defense/.test(o))                                   return '13_방어 관통';
    if (/AttackSpeed|MoveSpeed/.test(o))                             return '14_속도';
    if (/Bonus$/.test(o))                                            return '15_경험치/재화/드랍';
    if (/Monster.*Extra|Legion.*Extra|Beast.*Extra/.test(o))         return '16_몬스터 특수 대상';
    if (/Range$|RangeRate$/.test(o))                                 return '17_사거리';
    if (/Weight|CombatPower|ManaCostRate|CoolTimeRate/.test(o))      return '18_기타';
    return '99_미분류';
}

// 1차 능력치(영문 en)의 인게임 획득 경로 추정 — character_info.html이 알 수 있는 범위 내에서 판별
//   - "기본 스탯": STR/DEX/INT/AGI/CON/WIS/LUK
//   - "레벨":     LV_STAT_CONFIG에 등록된 키
//   - "장비":     장비 옵션 슬롯의 stats_calc.js 키 (EQ_TO_STAT_LIST 매핑된 21종)
//   - "제련":     REFINE_OPTION_POOL의 키 (전 슬롯 합집합)
//   - "클래스":   AttackSpeed/MoveSpeed (클래스 고유 속도 보너스)
//   - "기본 스탯 치환": BASE_STAT_SUBSTITUTION이 생성하는 키 (STR→PVEMeleeMinAttack 등)
function _statAcquireRoutes(en) {
    const routes = [];
    if (['STR','DEX','INT','AGI','CON','WIS','LUK'].includes(en)) routes.push('기본 스탯');
    if (['AttackSpeed','MoveSpeed'].includes(en)) routes.push('클래스 속도');
    // 레벨 능력치
    try {
        const lvRaw = localStorage.getItem('versione_lv_stat_config');
        if (lvRaw) {
            const cfg = JSON.parse(lvRaw);
            if (Array.isArray(cfg) && cfg.some(r => r.en === en)) routes.push('레벨');
        }
    } catch(_) {}
    // 장비 (EQ_TO_STAT_LIST에 매핑된 키)
    const EQUIPMENT_KEYS = new Set([
        'PVEMeleeMinAttack','PVEMeleeMaxAttack','PVPMeleeMinAttack','PVPMeleeMaxAttack',
        'PVERangedMinAttack','PVERangedMaxAttack','PVPRangedMinAttack','PVPRangedMaxAttack',
        'PVEMagicMinAttack','PVEMagicMaxAttack','PVPMagicMinAttack','PVPMagicMaxAttack',
        'PVENormalAttack','PVPNormalAttack','PVEAtCriticalAttack','PVPAtCriticalAttack',
        'PVESkillAttack','PVPSkillAttack',
        'PhysicalDefense','RangedDefense','MagicDefense',
    ]);
    if (EQUIPMENT_KEYS.has(en)) routes.push('장비');
    // 제련 (REFINE_OPTION_POOL 키 — field_battle.html 정의)
    const REFINE_KEYS = new Set([
        'STRAmplifyRate','DEXAmplifyRate','INTAmplifyRate','AGIAmplifyRate','CONAmplifyRate','WISAmplifyRate','LUKAmplifyRate','AllStatAmplifyRate',
        'MaxHealthPointAmplifyRate','MaxManaPointAmplifyRate',
        'PVECritical','PVEMeleeCritical','PVERangedCritical','PVEMagicCritical',
        'PhysicalDefenseAmplifyRate','RangedDefenseAmplifyRate','MagicDefenseAmplifyRate',
        'MeleeEvasion','RangedEvasion','MagicEvasion',
        'MeleeCriticalResist','RangedCriticalResist','MagicCriticalResist',
        'MeleeCriticalDamageReduction','RangedCriticalDamageReduction','MagicCriticalDamageReduction',
        'MeleeSkillDamageReduction','RangedSkillDamageReduction','MagicSkillDamageReduction','SkillDamageReduction',
        'StunResist','ParalysisResist','SilenceResist','HoldResist','SlowResist','ProvokeResist',
    ]);
    if (REFINE_KEYS.has(en)) routes.push('제련');
    // 기본 스탯 치환 — BASE_STAT_SUBSTITUTION 결과 키
    if (typeof BASE_STAT_SUBSTITUTION !== 'undefined') {
        for (const entries of Object.values(BASE_STAT_SUBSTITUTION)) {
            if (entries.some(e => e.key === en)) { routes.push('기본 스탯 치환'); break; }
        }
    }
    return routes;
}

const _ROUTE_COLORS = {
    '기본 스탯': '#79c0ff',
    '레벨': '#56d364',
    '장비': '#ff9966',
    '제련': '#d8a8e8',

function renderFormulas() {
    const container = document.getElementById('formula-list');
    if (!container) return;

    // ── 데이터 소스: stats_calc.js TOTAL_STAT_FORMULAS 우선 ──
    let data = [];
    if (typeof TOTAL_STAT_FORMULAS !== 'undefined' && Array.isArray(TOTAL_STAT_FORMULAS)) {
        data = TOTAL_STAT_FORMULAS.map(it => ({
            output:   it.o,
            category: it.c || _inferCategory(it.o),
            formula:  it.f || '',
            inputs:   Array.isArray(it.i) ? it.i : [],
        }));
    }
    // fallback: 데이터 없으면 안내 메시지
    if (data.length === 0) {
        container.innerHTML = `
            <div class="formula-intro">
                <strong>2차 능력치 산출 공식 데이터가 준비되지 않았습니다.</strong><br>
                stats_calc.js의 <code>TOTAL_STAT_FORMULAS</code> 배열이 정의되어야 표시됩니다. (002 합산공식 기반)
            </div>`;
        return;
    }

    // 카테고리별로 묶기 (sortable prefix)
    const byCat = new Map();
    for (const it of data) {
        const c = it.category;
        if (!byCat.has(c)) byCat.set(c, []);
        byCat.get(c).push(it);
    }
    const sortedCats = [...byCat.keys()].sort();

    // 누락 한글명 카운트 (검증용)
    let missingKrCount = 0;

    const html = sortedCats.map(cat => {
        const items = byCat.get(cat);
        // 카테고리명 — 접두 숫자 제거하여 표시
        const catLabel = cat.replace(/^\d+_/, '');
        const rowsHtml = items.map(it => {
            // 입력 1차 능력치 칩: "한글명(영문명)" 형식 + 획득 경로 라벨
            const inputChips = it.inputs.map(k => {
                const row = (typeof STAT_LIST !== 'undefined') ? STAT_LIST.find(s => s.en === k) : null;
                const kr  = row ? row.kr : null;
                if (!kr) missingKrCount++;
                const label = kr ? `${kr}(${k})` : `${k}`;
                const cls   = kr ? 'formula-chip' : 'formula-chip meta';
                const title = kr ? row.desc || k : `${k} — STAT_LIST 한글명 미정의`;
                const routes = _statAcquireRoutes(k);
                const routesHtml = routes.map(r =>
                    `<span class="formula-route" style="color:${_ROUTE_COLORS[r] || '#8b949e'};">${r}</span>`
                ).join('');
                return `<span class="${cls}" title="${title.replace(/"/g,"'")}">${label}${routesHtml}</span>`;
            }).join('');
            // 출력 키 라벨
            const outRow  = (typeof STAT_LIST !== 'undefined') ? STAT_LIST.find(s => 'Total' + s.en === it.output) : null;
            const outKr   = outRow ? outRow.kr : null;
            const outName = outKr ? `${outKr}(${it.output})` : it.output;
            return `<div class="formula-row">
                <div class="formula-name">${outName}</div>
                <div class="formula-body">
                    <div class="formula-eq"><code>${it.formula || '(공식 없음)'}</code></div>
                    <div class="formula-meta">
                        <span class="formula-meta-lbl">사용 1차 능력치:</span>
                        <span class="formula-chips">${inputChips || '<span class="formula-empty">(없음)</span>'}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
        return `<div class="formula-cat-section">
            <div class="formula-cat-header">${catLabel} <span class="formula-cat-count">${items.length}</span></div>
            ${rowsHtml}
        </div>`;
    }).join('');

    const headerNote = `
        <div class="formula-intro">
            <strong>2차 능력치 산출 공식 정리</strong> — <code>[베르시온] 002_스탯_합산공식.cs</code> 기반 자동 추출.
            총 <strong>${data.length}개</strong> 2차 능력치(Total*) 각각의 산출 공식과 사용된 1차 능력치를
            <strong>한글명(영문명)</strong> 형식으로 표시합니다.
            <br><br>
            <strong>1차 능력치 획득 경로:</strong>
            ${Object.entries(_ROUTE_COLORS).map(([k,v]) => `<span class="formula-route" style="color:${v};">${k}</span>`).join(' ')}
            <br>
            ${missingKrCount > 0 ? `<span style="color:#ff7b72;">⚠ STAT_LIST에 한글명이 없는 1차 능력치가 ${missingKrCount}건 — 영문명으로 표시됨</span>` : ''}
        </div>
    `;
    container.innerHTML = headerNote + html;
}

function renderList() {
    // 외부 보너스만 사용 — 게임 기본값(레벨 능력치·기본 스탯 치환)은 기본값으로 처리
    const bon     = externalBonuses();
    const search  = document.getElementById('search').value.toLowerCase().trim();
    const kinds   = ['기타','공격','방어','특수'];

    let list = STAT_LIST.filter(s => kinds.includes(s.kind));
    if (currentTab === '활성') {
        // 현재 수치가 0 초과인 능력치만 표시
        list = list.filter(s => {
            const computedVal = currentStats[s.en];
            const val = (computedVal !== undefined) ? computedVal : (bon[s.en] || 0);
            return val > 0;
        });
    } else if (currentTab !== '전체') {
        list = list.filter(s => s.kind === currentTab);
    }
    if (search) {
        list = list.filter(s =>
            s.kr.toLowerCase().includes(search) ||
            s.en.toLowerCase().includes(search) ||
            (s.desc||'').toLowerCase().includes(search)
        );
    }

    const container = document.getElementById('stat-list');
    if (list.length === 0) {
        container.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
    }

    const isSearching = !!search;

    // 1단계: group별로 묶기
    const groupMap = new Map();
    for (const stat of list) {
        const g = stat.group || '99_기타';
        if (!groupMap.has(g)) groupMap.set(g, []);
        groupMap.get(g).push(stat);
    }
    const sortedGroups = [...groupMap.keys()].sort();

    const html = sortedGroups.map(groupKey => {
        const groupStats = groupMap.get(groupKey);
        const meta       = getGroupMeta(groupKey);
        const isYakwa    = groupKey.startsWith('Z_');

        // 그룹 헤더

            `<div class="group-header${isYakwa ? ' yakwa' : ''}">
                <span class="group-icon">${meta.icon}</span>
                <span class="group-name">${meta.label}</span>
                <span class="group-count">${groupStats.length}개</span>
            </div>`;

        // 2단계: scope별로 묶기 (공통 → PVE → PVP)
        const scopeMap = new Map();
        for (const stat of groupStats) {
            const sc = stat.scope || '공통';
            if (!scopeMap.has(sc)) scopeMap.set(sc, []);
            scopeMap.get(sc).push(stat);
        }
        const sortedScopes = [...scopeMap.keys()].sort((a,b) => (SCOPE_ORDER[a]??9) - (SCOPE_ORDER[b]??9));

        // scope가 1종류뿐이면 scope 서브헤더 생략
        const needScopeHeader = sortedScopes.length > 1 && !isSearching;

        const scopeSectionsHtml = sortedScopes.map(scope => {

            const scopeHeaderHtml = needScopeHeader
                ? `<div class="scope-header">
                       <span class="scope-divider-label">${scope === '공통' ? '⬛ 공통' : scope === 'PVE' ? '🟦 PVE' : '🟥 PVP'}</span>
                       <span class="scope-divider-cnt">${scopeStats.length}</span>
                   </div>`
                : '';

            const rowsHtml = scopeStats.map(stat => {
                // computeStats가 STAT_LIST en 키로 별칭을 가지면 그 값, 없으면 bonus 값 자체가 해당 스탯의 값
                const computedVal = currentStats[stat.en];
                const bonus       = bon[stat.en] || 0;
                const val         = (computedVal !== undefined) ? computedVal : bonus;
                // 기본값 = 전체에서 보너스를 뺀 레벨/공식 기여분 (음수 방지)
                const base        = Math.max(0, val - bonus);
                const dimStyle    = isYakwa ? 'color:var(--dim)' : '';

                const fmtVal   = (typeof fmtStatDisplay === 'function') ? fmtStatDisplay(stat.en, val)   : val.toLocaleString();
                const fmtBase  = (typeof fmtStatDisplay === 'function') ? fmtStatDisplay(stat.en, base)  : base.toLocaleString();
                const fmtBonus = (typeof fmtStatDisplay === 'function') ? fmtStatDisplay(stat.en, bonus) : bonus.toLocaleString();
                const valHtml = bonus !== 0
                    ? `<div class="stat-base" style="color:var(--sub);font-size:15px;">${fmtBase}</div>
                       <div class="stat-bonus-lbl">+${fmtBonus}</div>
                       <div class="stat-total-lbl">${fmtVal}</div>`
                    : `<div class="stat-base" style="${dimStyle}">${val !== 0 ? fmtVal : '—'}</div>
                       <div class="stat-bonus-lbl"></div>`;

                // 검색 중에는 scope 배지 표시
                const badgeHtml = isSearching ? (SCOPE_BADGE[stat.scope||'공통']||'') : '';

                return `<div class="stat-row" title="${(stat.desc||'').replace(/"/g,"'")}">
                    <div class="dot dot-${stat.kind}"></div>
                    <div class="stat-names">
                        <div class="stat-kr" style="${dimStyle}">${stat.kr}${badgeHtml}</div>
                        <div class="stat-en">${stat.en}</div>
                    </div>
                    <div class="stat-vals">${valHtml}</div>
                </div>`;
            }).join('');

            return `${scopeHeaderHtml}<div class="stat-grid">${rowsHtml}</div>`;
        }).join('');

        return `<div class="stat-group-section">
            ${groupHeaderHtml}
            ${scopeSectionsHtml}
        </div>`;
    }).join('');

    container.innerHTML = html;
}

// _BONUS_SOURCES와 동기화된 라벨/색상/순서 메타데이터
//   - field_battle.html이 publish하는 카테고리 키와 일치해야 함
//   - 신규 카테고리 추가 시 여기에 한 줄 추가 → 자동 표시
const SOURCE_META = {
    equipment:    { label: '🗡 착용 장비',         color: '#9c9cf5', order: 10 },
    eqSubOptions: { label: '🔍 장비 부옵션(감정)', color: '#ffd86b', order: 15 },

    potential:    { label: '✨ 잠재력',            color: '#b388ff', order: 50 },
    morph:        { label: '🌟 변신',              color: '#ff9ed8', order: 60 },
    morphCodex:   { label: '📖 변신 도감',         color: '#ffd0e8', order: 65 },
    doll:         { label: '🧸 마법인형',          color: '#a78bfa', order: 70 },
    dollCodex:    { label: '📔 마법인형 도감',     color: '#c4b5fd', order: 75 },
    beast:        { label: '🐉 환수',              color: '#ffae42', order: 80 },

    altar:        { label: '⛩️ 제단 제련',          color: '#8be9c1', order: 100 },
    oracle:       { label: '🔮 오라클 카드',       color: '#7fdcff', order: 110 },
    oracleCodex:  { label: '📖 오라클 도감',       color: '#b6ecff', order: 115 },
    sealstone:    { label: '💎 봉인석 (공명+승화+해방)', color: '#ffd86b', order: 120 },
    sanctuary:    { label: '🏛 영웅의 성소 (계승)',  color: '#a78bfa', order: 130 },
};
// sourceId → 친화 라벨 (모르면 원본 그대로)
function _sourceLabel(srcId) {
    const cat = (srcId && srcId.startsWith('field:')) ? srcId.slice(6) : srcId;
    if (SOURCE_META[cat]) return SOURCE_META[cat].label;
    return cat || srcId;
}
function _sourceColor(srcId) {
    const cat = (srcId && srcId.startsWith('field:')) ? srcId.slice(6) : srcId;
    return (SOURCE_META[cat] && SOURCE_META[cat].color) || '#58a6ff';
}
function _sourceOrder(srcId) {
    const cat = (srcId && srcId.startsWith('field:')) ? srcId.slice(6) : srcId;
    return (SOURCE_META[cat] && SOURCE_META[cat].order) || 9999;
}

// stats_calc.js에 정의된 fmtStatDisplay/STAT_LIST/RAW_PCT_STAT_KEYS/COMPUTED_PCT_STAT_KEYS 사용
function _srcStatLabel(en) {
    if (typeof STAT_LIST !== 'undefined') {
        const row = STAT_LIST.find(x => x.en === en);
        if (row && row.kr) return row.kr;
    }
    return en;
}
function _srcFmtVal(en, raw) {
    const r = +raw || 0;
    if (typeof COMPUTED_PCT_STAT_KEYS !== 'undefined' && COMPUTED_PCT_STAT_KEYS.has(en)) {
        return '+' + r.toFixed(2) + '%';
    }
    if (typeof RAW_PCT_STAT_KEYS !== 'undefined' && RAW_PCT_STAT_KEYS.has(en)) {
        return '+' + (r / 100).toFixed(2) + '%';
    }
    return '+' + Math.floor(r).toLocaleString();
}

function renderSourceBreakdown() {
    const root = document.getElementById('source-list');
    if (!root) return;
    // 외부 보너스 출처만 (게임 기본값 __ 제외)
    const entries = Object.keys(bonusReg)
        .filter(s => !isGameDefault(s))
        .map(srcId => ({ srcId, stats: bonusReg[srcId] || {} }))
        // 비-0 stat이 1개 이상인 출처만 표시
        .filter(e => Object.values(e.stats).some(v => Number.isFinite(v) && v !== 0))
        .sort((a, b) => _sourceOrder(a.srcId) - _sourceOrder(b.srcId));

    // 헤더 — 통합 합산 + 출처 카운트 + 안내
    let totalStatCnt = 0;
    const mergedAll = {};
    for (const e of entries) {
        for (const [k, v] of Object.entries(e.stats)) {
            if (!Number.isFinite(v) || v === 0) continue;
            mergedAll[k] = (mergedAll[k] || 0) + v;
        }
    }
    totalStatCnt = Object.keys(mergedAll).length;
    const intro = `<div class="src-intro">
        🎁 외부 보너스 출처 <b style="color:var(--gold);">${entries.length.toLocaleString()}</b>개에서 <b style="color:var(--gold);">${totalStatCnt.toLocaleString()}</b>종의 능력치가 적용 중입니다.
        <br><span style="color:var(--dim);font-size:12px;">※ 게임 기본값(레벨 능력치 등)은 제외. 같은 능력치가 여러 출처에 있으면 각 출처별로 따로 표시되며 내부 합산에서 모두 더해집니다.</span>
    </div>`;

    if (entries.length === 0) {
        root.innerHTML = intro + `<div class="src-empty">아직 적용 중인 외부 보너스가 없습니다.<br><span style="color:var(--dim);font-size:13px;">장비 착용 · 변신 활성화 · 봉인석 공명 · 영웅의 성소 계승 등을 진행하면 여기에 출처별로 표시됩니다.</span></div>`;
        return;
    }

    // 통합 합산 카드 (최상단)
    const mergedSorted = Object.keys(mergedAll)
        .map(en => ({ en, kr: _srcStatLabel(en), val: mergedAll[en], fmt: _srcFmtVal(en, mergedAll[en]) }))
        .sort((a, b) => a.kr.localeCompare(b.kr, 'ko'));
    const mergedRows = mergedSorted.map(it =>
        `<div class="src-stat-row"><span class="src-stat-name" title="${it.en}">${it.kr}</span><span class="src-stat-val" style="color:#ffd86b;">${it.fmt}</span></div>`
    ).join('');
    const mergedSection = `<div class="src-section" style="border-left-color:#ffd86b;">
        <div class="src-section-head" style="background:linear-gradient(90deg,rgba(255,216,107,0.18),transparent);">
            <span class="src-section-name" style="color:#ffd86b;">🔢 전체 출처 통합 합산</span>
            <span class="src-section-cnt">${mergedSorted.length}개 능력치</span>
        </div>
        <div class="src-stat-grid">${mergedRows}</div>
    </div>`;

    // 출처별 카드
    const sections = entries.map(e => {
        const list = Object.keys(e.stats)
            .map(en => ({ en, val: e.stats[en] }))
            .filter(it => Number.isFinite(it.val) && it.val !== 0)
            .map(it => ({ ...it, kr: _srcStatLabel(it.en), fmt: _srcFmtVal(it.en, it.val) }))
            .sort((a, b) => a.kr.localeCompare(b.kr, 'ko'));
        const color = _sourceColor(e.srcId);
        const label = _sourceLabel(e.srcId);
        const rows = list.map(it =>
            `<div class="src-stat-row"><span class="src-stat-name" title="${it.en}">${it.kr}</span><span class="src-stat-val" style="color:${color};">${it.fmt}</span></div>`
        ).join('');
        return `<div class="src-section" style="border-left-color:${color};">
            <div class="src-section-head" style="background:linear-gradient(90deg,${color}22,transparent);">
                <span class="src-section-name" style="color:${color};">${label}</span>
                <span class="src-section-cnt">${list.length}개 능력치</span>
            </div>
            <div class="src-stat-grid">${rows}</div>
        </div>`;
    }).join('');

    root.innerHTML = intro + mergedSection + sections;
}

// ════════════════════════════════════════════════════════════
//  🎯 스탯 분배 — character_info 측 UI 로직
// ════════════════════════════════════════════════════════════
// 데이터 출처 (모두 localStorage):
//   versione_distrib_stat_config           — { startLv, perLv }   (전 클래스 공통 설정)
//   versione_distributed_stats_<classId>   — 현재 클래스의 분배 결과 { STR,...,LUK }
//   versione_char (.classId / .level)      — 현재 클래스 ID + 캐릭터 레벨
//
// 편집은 임시 객체(_dstPending)에 보관 → [적용] 누르면 localStorage에 저장 + parent로 postMessage
// [전체 회수] / [편집 취소] 버튼은 임시 객체만 조작 — 적용 전엔 인게임 영향 없음

const _DST_BASE_STATS = ['STR','DEX','INT','AGI','CON','WIS','LUK'];
const _DST_STAT_META = {
    STR: { kr: '힘',   desc: '근거리 계열' },
    DEX: { kr: '민첩', desc: '원거리 계열' },
    INT: { kr: '지능', desc: '마법 계열'   },
    AGI: { kr: '순발', desc: '속도/회피'   },
    CON: { kr: '건강', desc: 'HP/방어'     },
    WIS: { kr: '지혜', desc: 'MP/마법방어' },
    LUK: { kr: '행운', desc: '치명타/저항' },
};

// 편집 임시 객체 — 적용 전까지의 변경 상태
let _dstPending = null;       // { STR:n, DEX:n, ... } 또는 null(편집 시작 전)
let _dstSavedSnapshot = null; // 적용된 직후의 분배값 스냅샷 (외부 변경 감지용)

function _dstReadConfig() {
    try {
        const raw = localStorage.getItem('versione_distrib_stat_config');
        if (raw) {
            const d = JSON.parse(raw);
            const sl = parseInt(d.startLv);
            const pl = parseInt(d.perLv);
            if (Number.isFinite(sl) && Number.isFinite(pl)) {
                return { startLv: Math.max(1, sl), perLv: Math.max(0, pl) };
            }
        }
    } catch (_) {}
    return { startLv: 10, perLv: 3 };
}
function _dstReadCurrentClass() {
    try {
        const raw = localStorage.getItem('versione_char');
        if (raw) {
            const d = JSON.parse(raw);
            if (d.classId) return d.classId;
        }
        return localStorage.getItem('versione_current_class') || 'knight';
    } catch (_) { return 'knight'; }
}
function _dstReadStats(classId) {
    try {
        const raw = localStorage.getItem('versione_distributed_stats_' + classId);
        if (raw) {
            const d = JSON.parse(raw) || {};
            const out = {};
            _DST_BASE_STATS.forEach(k => {
                const v = parseInt(d[k]);
                out[k] = Number.isFinite(v) && v > 0 ? v : 0;
            });
            return out;
        }
    } catch (_) {}
    const out = {}; _DST_BASE_STATS.forEach(k => out[k] = 0); return out;
}
function _dstWriteStats(classId, dist) {
    try {
        localStorage.setItem('versione_distributed_stats_' + classId, JSON.stringify(dist));
    } catch (_) {}
}
function _dstTotalPoints(lv) {
    const c = _dstReadConfig();
    if (!c || c.perLv <= 0) return 0;
    if (lv < c.startLv) return 0;
    return (lv - c.startLv + 1) * c.perLv;
}
function _dstUsedPoints(dist) {
    let s = 0;
    for (const k of _DST_BASE_STATS) s += (dist[k] || 0);
    return s;
}
// 분배 임시값이 외부 변경(저장값)과 다른지 — '미적용 변경' 판별
function _dstIsDirty() {
    if (!_dstPending) return false;
    const saved = _dstSavedSnapshot || {};
    for (const k of _DST_BASE_STATS) {
        if ((_dstPending[k] || 0) !== (saved[k] || 0)) return true;
    }
    return false;
}

// 메인 렌더링 — `forceReload=true`면 임시 편집값을 버리고 저장값 기준으로 재시작
function renderDistribPanel(forceReload) {
    const container = document.getElementById('distrib-panel-body');
    if (!container) return;
    const cfg     = _dstReadConfig();
    const classId = _dstReadCurrentClass();
    const lv      = currentLevel || 1;
    const total   = _dstTotalPoints(lv);
    const saved   = _dstReadStats(classId);
    _dstSavedSnapshot = saved;

    // 임시 편집값 초기화 — 강제 리로드 또는 처음 진입
    if (forceReload || !_dstPending) {
        _dstPending = { ...saved };
    }

    // 분배 기능이 비활성 상태 (perLv=0 또는 startLv 이후 → 보유 0)
    if (cfg.perLv <= 0) {
        container.innerHTML = `<div class="dst-not-available">
            🛈 분배 스탯이 비활성 상태입니다.<br>
            <b>캐릭터 공통 능력치 설정 > 📈 레벨 능력치</b> 탭의 <b>🎯 레벨업 분배 스탯</b> 섹션에서
            <code>레벨당 획득</code>을 <code>1 이상</code>으로 설정하면 활성화됩니다.
        </div>`;
        return;
    }
    if (lv < cfg.startLv) {
        container.innerHTML = `<div class="dst-not-available">
            🛈 분배 스탯 획득 시작 레벨에 도달하지 않았습니다.<br>
            현재 <b>Lv. ${lv}</b> · 획득 시작 <b>Lv. ${cfg.startLv}</b> ·
            도달까지 <b>${cfg.startLv - lv}레벨</b> 남음.<br>
            <span style="color:var(--dim);font-size:15px;">시작 레벨 도달 시 매 레벨업마다 <code>+${cfg.perLv}</code>포인트씩 누적됩니다.</span>
        </div>`;
        return;
    }

    const used  = _dstUsedPoints(_dstPending);
    const remain = total - used;
    const dirty = _dstIsDirty();

    // 분배 결과 + 치환 미리보기 계산
    // computeStats 입력: 현재 보너스(bonusReg에 이미 distribStats가 포함) 대신
    // "기본 스탯 + 현재 임시 분배값"만 가지고 미리보기 계산
    const previewBon = {};
    // 다른 외부 보너스도 합치고 (장비 등) 임시 분배값만 STR/DEX 등으로 덮어쓰기
    // → 가장 안전한 방법: bonusReg를 deep copy 후 'field:distribStats'를 임시값으로 교체
    const bonusOverride = { ..._dstPending };
    // 기존 bonusReg에서 STR/DEX 키가 있을 수 있으므로 명확히 따로 처리
    const mergedAll = {};
    for (const [src, stats] of Object.entries(bonusReg)) {
        if (src === 'field:distribStats') continue; // 임시값으로 교체할 것이므로 스킵
        for (const [k, v] of Object.entries(stats)) {
            mergedAll[k] = (mergedAll[k] || 0) + v;
        }
    }
    for (const k of _DST_BASE_STATS) {
        if (bonusOverride[k] > 0) mergedAll[k] = (mergedAll[k] || 0) + bonusOverride[k];
    }
    const previewStats = (typeof computeStats === 'function')
        ? computeStats(mergedAll, currentBaseStats) : {};

    // 기준 비교용: 분배가 모두 0인 상태에서의 스탯
    const baselineBon = {};
    for (const [src, stats] of Object.entries(bonusReg)) {
        if (src === 'field:distribStats') continue;
        for (const [k, v] of Object.entries(stats)) {
            baselineBon[k] = (baselineBon[k] || 0) + v;
        }
    }
    const baselineStats = (typeof computeStats === 'function')
        ? computeStats(baselineBon, currentBaseStats) : {};

    // ── 헤더 카드 ──
    const headerHtml = `
        <div class="dst-header-card">
            <div class="dst-header-title">🎯 스탯 분배 — Lv. ${lv} · ${(_classLabel(classId)) || classId}</div>
            <div class="dst-header-desc">
                레벨업으로 획득한 포인트를 7개 기본 스탯에 자유롭게 분배합니다.
                분배 결과는 캐릭터의 기본 스탯에 더해지고 자동 치환되어 2차 능력치에 반영됩니다.
                <br>분배 결과는 <b>클래스별로 개별 저장</b>되며 클래스를 변경해도 보존됩니다.
                <br>
                <span style="color:var(--dim);">획득 규칙: <code>Lv.${cfg.startLv}</code>부터 매 레벨업마다 <code>+${cfg.perLv}</code>포인트 누적</span>
            </div>
            <div class="dst-summary-row">
                <span><span class="lbl">총 보유 포인트</span><span class="val">${total.toLocaleString()}</span></span>
                <span><span class="lbl">사용</span><span class="val ${used > total ? 'warn' : ''}">${used.toLocaleString()}</span></span>
                <span><span class="lbl">잔여</span><span class="val ${remain < 0 ? 'warn' : (remain === 0 ? 'dim' : '')}">${remain.toLocaleString()}</span></span>
                ${dirty ? '<span class="dst-msg warn">• 미적용 변경 있음</span>' : ''}
            </div>
        </div>`;

    // ── 분배 테이블 ──
    const rowsHtml = _DST_BASE_STATS.map(k => {
        const meta  = _DST_STAT_META[k];
        const base  = currentBaseStats[k] || 0;
        const cur   = _dstPending[k] || 0;
        const eff   = previewStats[k] != null ? previewStats[k] : (base + cur);
        const baseEff = baselineStats[k] != null ? baselineStats[k] : base;
        const delta = eff - baseEff;
        const minusDisabled = cur <= 0 ? 'disabled' : '';
        const plusDisabled  = (remain <= 0) ? 'disabled' : '';
        return `<tr>
            <td class="dst-stat-name">${meta.kr}<span class="dst-stat-abbr">(${k})</span></td>
            <td class="dst-base">${base.toLocaleString()}</td>
            <td>
                <div class="dst-ctrl">
                    <button class="dst-btn" onclick="dstAdjust('${k}', -1)" ${minusDisabled}>−</button>
                    <input class="dst-input" type="number" min="0" step="1"
                           id="dst-in-${k}" value="${cur}"
                           oninput="dstInputChange('${k}')"
                           onblur="dstInputBlur('${k}')">
                    <button class="dst-btn" onclick="dstAdjust('${k}', +1)" ${plusDisabled}>+</button>
                </div>
            </td>
            <td class="dst-eff">${(eff).toLocaleString()}</td>
            <td class="dst-delta ${delta <= 0 ? 'zero' : ''}">${delta > 0 ? '+' + delta.toLocaleString() : (delta < 0 ? delta.toLocaleString() : '0')}</td>
        </tr>`;
    }).join('');
    const tableHtml = `
        <table class="dst-table">
            <thead>
                <tr>
                    <th style="text-align:left;">기본 스탯</th>
                    <th>설정값</th>
                    <th>분배</th>
                    <th>실효</th>
                    <th>변화</th>
                </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
        </table>`;

    // ── 버튼 행 ──
    const applyDisabled = (!dirty || used > total) ? 'disabled' : '';
    const resetDisabled = (_dstUsedPoints(saved) === 0 && _dstUsedPoints(_dstPending) === 0) ? 'disabled' : '';
    const revertDisabled = !dirty ? 'disabled' : '';
    const buttonsHtml = `
        <div class="dst-buttons-row">
            <span class="dst-msg" id="dst-status-msg"></span>
            <button class="dst-action-btn revert" ${revertDisabled} onclick="dstRevertEdits()">↺ 편집 취소</button>
            <button class="dst-action-btn reset"  ${resetDisabled}  onclick="dstResetAll()">🗑 전체 회수</button>
            <button class="dst-action-btn apply"  ${applyDisabled}  onclick="dstApply()">✔ 적용</button>
        </div>`;

    // ── 치환 결과 미리보기 ──
    // 치환 능력치 탭과 동일한 2컬럼 그룹 레이아웃(BASE_STAT_SUBSTITUTION 기반)으로 표시.
    // 분배가 1포인트 이상 들어간 기본 스탯 그룹만 노출하여 변화 영역을 한눈에 파악.
    // 각 항목은 "치환 후 값 (+델타)" 형태로, 변화가 없는 항목도 그룹 안에서 함께 보이도록 한다.
    let substHtml = '';
    let anyDistribGroup = false;
    if (typeof BASE_STAT_SUBSTITUTION !== 'undefined') {
        const pctSet = (typeof SUBST_PCT_STATS !== 'undefined') ? SUBST_PCT_STATS : new Set();
        let bodyHtml = '';
        for (const grp of KEY_GROUP_META) {
            const distribVal = _dstPending[grp.stat] || 0;
            if (distribVal <= 0) continue; // 분배 0인 그룹은 표시하지 않음
            const entries = BASE_STAT_SUBSTITUTION[grp.stat] || [];
            if (!entries.length) continue;
            anyDistribGroup = true;
            bodyHtml += `<div class="key-group-header dst-key-group-header">
                <span>${grp.label}</span>
                <span class="dst-key-grp-dist">분배 +${distribVal}</span>
            </div>`;
            for (const e of entries) {
                const en      = e.key;
                const after   = previewStats[en];
                const before  = baselineStats[en];
                if (after == null || before == null) continue;
                const delta   = after - before;
                const isPct   = pctSet.has(en);
                const afterDisp = isPct
                    ? (after / 100).toFixed(2) + '%'
                    : Math.round(after).toLocaleString();
                let deltaHtml = '';
                if (Math.abs(delta) >= 0.5) {
                    const dStr = isPct
                        ? (Math.abs(delta) / 100).toFixed(2) + '%'
                        : Math.round(Math.abs(delta)).toLocaleString();
                    const sign = delta > 0 ? '+' : '−';
                    deltaHtml = `<span class="dst-key-item-delta ${delta > 0 ? 'pos' : 'neg'}">${sign}${dStr}</span>`;
                }
                bodyHtml += `<div class="key-item dst-key-item ${grp.cls}">
                    <span class="key-item-name">${e.label}(${en})</span>
                    <span class="key-item-val">${afterDisp}${deltaHtml}</span>
                </div>`;
            }
        }
        substHtml = anyDistribGroup
            ? `<div class="dst-subst-key-grid">${bodyHtml}</div>`
            : `<div class="dst-subst-empty">분배가 0인 상태입니다. 위 표에서 1 이상 분배하면 해당 기본 스탯의 치환 능력치 변화가 표시됩니다.</div>`;
    }
    const substSectionHtml = `
        <div class="dst-section-title">⚡ 분배에 의한 치환 능력치 변화 (미리보기)</div>
        <div class="dst-subst-note">분배가 적용된 기본 스탯 그룹만 표시됩니다. 항목 우측의 <b style="color:#58d364;">+델타</b>가 분배 0 대비 증가량입니다.</div>
        ${substHtml}`;

    container.innerHTML = headerHtml + tableHtml + buttonsHtml + substSectionHtml;
}

function _classLabel(classId) {
    const M = {
        knight:'나이트', warrior:'워리어', assassin:'어쌔신',
        archer:'아처', cleric:'클레릭', sorcerer:'소서러'
    };
    return M[classId] || classId;
}

function dstAdjust(stat, delta) {
    if (!_dstPending) return;
    const cfg = _dstReadConfig();
    const total = _dstTotalPoints(currentLevel || 1);
    const cur = _dstPending[stat] || 0;
    const next = Math.max(0, cur + delta);
    // 잔여 검증
    const usedExcept = _dstUsedPoints(_dstPending) - cur;
    const maxAllow = total - usedExcept;
    _dstPending[stat] = Math.min(next, Math.max(0, maxAllow));
    renderDistribPanel(false);
}

function dstInputChange(stat) {
    const el = document.getElementById('dst-in-' + stat);
    if (!el) return;
    // 즉시 임시 객체 갱신 + 잔여 표시 갱신 (전체 재렌더 X — 포커스 보호)
    const v = parseInt(el.value);
    _dstPending[stat] = Number.isFinite(v) && v >= 0 ? v : 0;
    // 잔여 / 미적용 메시지만 부분 갱신
    const total = _dstTotalPoints(currentLevel || 1);
    const used  = _dstUsedPoints(_dstPending);
    const sumRow = document.querySelector('.dst-summary-row');
    if (sumRow) {
        const remain = total - used;
        sumRow.innerHTML =
            `<span><span class="lbl">총 보유 포인트</span><span class="val">${total.toLocaleString()}</span></span>` +
            `<span><span class="lbl">사용</span><span class="val ${used > total ? 'warn' : ''}">${used.toLocaleString()}</span></span>` +
            `<span><span class="lbl">잔여</span><span class="val ${remain < 0 ? 'warn' : (remain === 0 ? 'dim' : '')}">${remain.toLocaleString()}</span></span>` +
            (_dstIsDirty() ? '<span class="dst-msg warn">• 미적용 변경 있음</span>' : '');
    }
}
function dstInputBlur(stat) {
    // 입력 종료 — 잔여 검증 + 전체 재렌더(미리보기 갱신)
    const total = _dstTotalPoints(currentLevel || 1);
    const used  = _dstUsedPoints(_dstPending);
    if (used > total) {
        // 초과 → 해당 입력값을 가능한 최대치로 조정
        const usedExcept = used - (_dstPending[stat] || 0);
        const maxAllow = Math.max(0, total - usedExcept);
        _dstPending[stat] = maxAllow;
        toast(`잔여 포인트 초과 — ${stat} 값을 ${maxAllow}로 조정`);
    }
    renderDistribPanel(false);
}

function dstResetAll() {
    if (!_dstPending) return;
    _DST_BASE_STATS.forEach(k => _dstPending[k] = 0);
    renderDistribPanel(false);
}

function dstRevertEdits() {
    _dstPending = null;
    renderDistribPanel(true);
}

function dstApply() {
    const total = _dstTotalPoints(currentLevel || 1);
    const used  = _dstUsedPoints(_dstPending);
    if (used > total) { toast('잔여 포인트 초과 — 적용 불가'); return; }
    const classId = _dstReadCurrentClass();
    _dstWriteStats(classId, _dstPending);
    _dstSavedSnapshot = { ..._dstPending };
    // parent(field_battle.html)에 알림 → DISTRIBUTED_STATS 재로드 + 전투 스탯 재계산
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'distrib-applied',
                classId: classId,
                stats:   { ..._dstPending },
            }, '*');
        }
    } catch (_) {}
    toast(`✔ 분배 적용 — 사용 ${used} / 총 ${total}`);
    // 잠시 후 syncNow로 캐릭터 스탯 다시 받기
    setTimeout(syncNow, 50);
    renderDistribPanel(false);
}

// ════════════════════════════════════════════════════════════
//  토스트 알림
// ════════════════════════════════════════════════════════════
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ════════════════════════════════════════════════════════════
//  초기화 + 자동 동기화 (1초마다 localStorage 폴링)
// ════════════════════════════════════════════════════════════
// iframe 내에서 실행될 때: 헤더 숨김 (팝업 타이틀바가 대신 표시)
(function() {
    if (window.parent !== window) {
        const hdr = document.getElementById('header');
        if (hdr) hdr.style.display = 'none';
    }
})();

syncNow();
setInterval(syncNow, 1000);

// localStorage 변경 즉시 반영 (field_battle.html이 저장하면 바로 갱신)
// versione_char_bonuses: 장비/강화/제련/클래스속도 등 모든 능력치 보너스 통합 키 (field_battle._publishCharBonuses)
window.addEventListener('storage', (e) => {
    if (['versione_char', 'versione_lv_stat_config', 'versione_base_stats',
         'versione_char_bonuses', 'versione_distrib_stat_config'].includes(e.key)) {
        syncNow();
    }
    // 분배 결과 외부 변경(예: 진행 초기화) — 현재 클래스 키이면 분배 패널 강제 리로드
    if (e.key && e.key.startsWith('versione_distributed_stats_')) {
        const cid = e.key.slice('versione_distributed_stats_'.length);
        if (cid === _dstReadCurrentClass()) {
            _dstPending = null; // 외부 변경 → 임시 편집 초기화
            const distribTab = document.getElementById('mtab-btn-distrib');
            if (distribTab && distribTab.classList.contains('on')) renderDistribPanel(true);
        }
    }
});

</script>
</body>
</html>
